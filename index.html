<body>
<img src="assets/share-cover.jpg?v=3" width="300" height="300" alt="" aria-hidden="true" style="position:absolute;top:0;left:0;width:300px;height:300px;opacity:.01;pointer-events:none;z-index:-1">
<main class="experience" data-state="intro">
<header class="brand"><img src="assets/evoc-group.png" alt="研祥集团 · 中国企业500强" width="642" height="175"></header>
<div class="cinema">
<div class="stage" id="stage">
<img class="backdrop opening" src="assets/opening.jpg" alt="" width="720" height="1280">
<img class="backdrop ending" src="assets/ending.jpg" alt="" width="720" height="1280">
<video id="film" playsinline webkit-playsinline preload="metadata" poster="assets/opening.jpg" aria-label="研祥集团中秋创意短片" tabindex="-1"><source src="assets/mid-autumn.mp4" type="video/mp4"></video>
<div class="shade"></div>
<section class="intro layer" id="intro" aria-label="开启中秋短片">
<div class="intro-action"><button id="start" class="ignite"><span class="ignite-symbol" aria-hidden="true">✦</span><span>点亮月光</span></button><p>轻触开启 · 建议打开声音</p></div>
</section>
<section class="ending-layer layer" id="moonScene" aria-label="触月送祝福" hidden>
<button id="moon" class="moon-target" aria-label="轻触明月，揭开中秋祝福"><span class="moon-ring"></span></button>
<div class="moon-hint" id="moonHint"><span class="hint-line"></span><span>轻触明月，开启祝福</span></div>
<div class="greeting" id="greeting" hidden><h1><span>研祥集团</span><strong>祝您中秋快乐</strong></h1></div>
<button id="replay" class="replay">再看一次 <span aria-hidden="true">↻</span></button>
</section>
<section class="checkpoint layer" id="checkpoint" aria-label="视频互动" hidden><div class="checkpoint-card"><p id="checkpointHint"></p><button id="gesture" class="gesture" aria-label="互动操作"><i class="guide-dot" aria-hidden="true"></i><i class="guide-dot" aria-hidden="true"></i><span id="gestureIcon" aria-hidden="true">↑</span><span id="gestureLabel">向上轻滑</span><span class="hold-track"><i id="holdFill"></i></span></button><button id="continueCheckpoint" class="text-button">点击继续</button></div></section>
<div class="film-controls" id="filmControls" hidden><button id="pause" class="utility" aria-label="暂停播放">暂停</button><span class="time" id="time">00:00 / 00:15</span><button id="sound" class="utility" aria-pressed="true" aria-label="关闭声音">声音 开</button></div>
<div class="progress-track" id="progressTrack" hidden><div id="progressFill"></div></div>
<div class="notice" id="notice" role="status" hidden>正在加载月光…</div>
<div class="error-panel" id="errorPanel" hidden role="alert"><p id="errorText">短片暂时未能播放，请重试。</p><button id="retry" class="small-button">重新播放</button><button id="toMoon" class="text-button">直接开启祝福</button></div>
<div id="particles" class="particles" aria-hidden="true"></div>
</div>
</div>
<footer><span id="footerLabel">中秋 · 与您共赏</span></footer>
<p class="sr-only" id="announcement" aria-live="polite"></p>
<noscript><p class="noscript">请启用浏览器 JavaScript 以体验互动。<a href="assets/mid-autumn.mp4">观看短片</a></p></noscript>
</main>
</body>
